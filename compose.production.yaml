services:
  app:
    build: .
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8080}:8080"
    environment:
      APP_ENV: ${APP_ENV:-internal}
      ADDR: 0.0.0.0:8080
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?Set PUBLIC_BASE_URL in .env.production}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?Set ADMIN_USERNAME in .env.production}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env.production}
      DATABASE_URL: postgres://mocklab:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}@db:5432/mocklab?sslmode=disable
      MOCK_CORS_ORIGINS: ${MOCK_CORS_ORIGINS:-}
      MOCK_CORS_HEADERS: ${MOCK_CORS_HEADERS:-Content-Type,Authorization,X-Api-Key}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mocklab
      POSTGRES_USER: mocklab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    volumes:
      - production_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mocklab -d mocklab"]
      interval: 3s
      timeout: 3s
      retries: 15
    restart: unless-stopped
volumes:
  production_postgres_data:
