name: CD (Podman VPS)

on:
  push:
    branches:
      - main       # Auto-builds and deploys to prod
      - develop    # Auto-builds and deploys to dev
    tags:
      - 'v*'       # Auto-builds and deploys release tag to prod
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target deployment environment'
        required: true
        type: choice
        default: 'dev'
        options:
          - dev
          - prod
      version:
        description: 'Image version for prod (e.g. v1.0). Ignored for dev (dev always uses :dev)'
        required: false
        type: string
        default: 'v1.0'
      branch:
        description: 'Branch or Git ref to deploy (leave empty to use selected branch)'
        required: false
        type: string
        default: ''
      skip_tests:
        description: 'Skip CI test checks before building and deploying'
        required: false
        type: boolean
        default: false

concurrency:
  group: cd-${{ inputs.environment || (github.ref_name == 'main' && 'prod' || 'dev') }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  ci-check:
    name: Run CI Checks
    if: ${{ !inputs.skip_tests }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch != '' && inputs.branch || github.ref }}

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run frontend unit tests
        run: |
          npm ci
          npm test

      - name: Generate templates and build assets
        run: |
          go tool templ generate
          npm run build

      - name: Run Go tests and vet
        run: |
          go test -race ./...
          go vet ./...

  build-and-push:
    name: Build & Push Image to GitHub (GHCR)
    needs: [ci-check]
    if: always() && (needs.ci-check.result == 'success' || needs.ci-check.result == 'skipped' || inputs.skip_tests == true)
    runs-on: ubuntu-latest
    outputs:
      image_name: ${{ steps.build.outputs.image_name }}
      target_env: ${{ steps.meta.outputs.target_env }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch != '' && inputs.branch || github.ref }}

      - name: Resolve metadata
        id: meta
        env:
          INPUT_ENV: ${{ inputs.environment }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          TARGET_ENV="${INPUT_ENV}"
          if [ -z "${TARGET_ENV}" ]; then
            if [ "${REF_NAME}" = "main" ] || [[ "${REF_NAME}" =~ ^v[0-9] ]]; then
              TARGET_ENV="prod"
            else
              TARGET_ENV="dev"
            fi
          fi

          # Versioning rule:
          # If dev: image version is always 'dev'
          # If prod: use version input (e.g. v1.0) or git tag (v*), fallback to 'v1.0'
          if [ "${TARGET_ENV}" = "dev" ]; then
            IMAGE_TAG="dev"
          else
            if [ -n "${INPUT_VERSION}" ]; then
              IMAGE_TAG="${INPUT_VERSION}"
            elif [[ "${REF_NAME}" =~ ^v[0-9] ]]; then
              IMAGE_TAG="${REF_NAME}"
            else
              IMAGE_TAG="v1.0"
            fi
          fi

          REPO_LOWER=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          IMAGE_BASE="ghcr.io/${REPO_LOWER}"
          FULL_IMAGE="${IMAGE_BASE}:${IMAGE_TAG}"

          echo "target_env=${TARGET_ENV}" >> "$GITHUB_OUTPUT"
          echo "image_base=${IMAGE_BASE}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "image_name=${FULL_IMAGE}" >> "$GITHUB_OUTPUT"

          echo "=========================================================="
          echo " Target Environment : ${TARGET_ENV}"
          echo " Image Version Tag  : ${IMAGE_TAG}"
          echo " Full Image Name    : ${FULL_IMAGE}"
          echo " Commit SHA         : ${GITHUB_SHA}"
          echo "=========================================================="

      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push container image
        id: build
        env:
          TARGET_ENV: ${{ steps.meta.outputs.target_env }}
          IMAGE_NAME: ${{ steps.meta.outputs.image_name }}
          IMAGE_BASE: ${{ steps.meta.outputs.image_base }}
        run: |
          echo "--> Building image ${IMAGE_NAME}..."
          BUILD_TAGS="-t ${IMAGE_NAME} -t ${IMAGE_BASE}:${GITHUB_SHA}"
          if [ "${TARGET_ENV}" = "prod" ]; then
            BUILD_TAGS="${BUILD_TAGS} -t ${IMAGE_BASE}:latest"
          fi

          # shellcheck disable=SC2086
          podman build $BUILD_TAGS -f Dockerfile .

          echo "--> Pushing ${IMAGE_NAME} to ghcr.io..."
          podman push "${IMAGE_NAME}"
          podman push "${IMAGE_BASE}:${GITHUB_SHA}"
          if [ "${TARGET_ENV}" = "prod" ]; then
            podman push "${IMAGE_BASE}:latest"
          fi

          echo "image_name=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

  deploy-vps:
    name: Deploy to VPS (${{ needs.build-and-push.outputs.target_env }})
    needs: [build-and-push]
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.build-and-push.outputs.target_env }}
      url: ${{ vars.PUBLIC_BASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch != '' && inputs.branch || github.ref }}

      - name: Setup SSH client & authentication (Password or Key)
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -p "${SSH_PORT}" -H "${SSH_HOST}" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 644 ~/.ssh/known_hosts

          if [ -n "${SSH_PASSWORD}" ]; then
            echo "--> Configuring SSH password authentication via sshpass..."
            sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
            echo "SSH_AUTH=password" >> "$GITHUB_ENV"
          elif [ -n "${SSH_PRIVATE_KEY}" ]; then
            echo "--> Configuring SSH key authentication..."
            echo "${SSH_PRIVATE_KEY}" | tr -d '\r' > ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa
            echo "SSH_AUTH=key" >> "$GITHUB_ENV"
          else
            echo "Error: Neither SSH_PASSWORD nor SSH_PRIVATE_KEY is defined in GitHub Secrets." >&2
            exit 1
          fi

      - name: Upload environment configuration to VPS
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
          TARGET_ENV: ${{ needs.build-and-push.outputs.target_env }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || (needs.build-and-push.outputs.target_env == 'prod' && '/opt/mocklab/prod' || '/opt/mocklab/dev') }}
          # App configuration secrets and variables
          APP_ENV: ${{ vars.APP_ENV || (vars.PUBLIC_BASE_URL != '' && (needs.build-and-push.outputs.target_env == 'prod' && 'internal' || 'development') || 'development') }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL || '' }}
          ADMIN_USERNAME: ${{ vars.ADMIN_USERNAME || 'admin' }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          MOCK_CORS_ORIGINS: ${{ vars.MOCK_CORS_ORIGINS || '' }}
          MOCK_CORS_HEADERS: ${{ vars.MOCK_CORS_HEADERS || 'Content-Type,Authorization,X-Api-Key' }}
        run: |
          if [ "${SSH_AUTH}" = "password" ]; then
            SSH_CMD="sshpass -e ssh -o StrictHostKeyChecking=accept-new -p ${SSH_PORT}"
            SCP_CMD="sshpass -e scp -o StrictHostKeyChecking=accept-new -P ${SSH_PORT}"
          else
            SSH_CMD="ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=accept-new -p ${SSH_PORT}"
            SCP_CMD="scp -i ~/.ssh/id_rsa -o StrictHostKeyChecking=accept-new -P ${SSH_PORT}"
          fi

          echo "--> Preparing destination directory ${DEPLOY_PATH} on VPS..."
          $SSH_CMD "${SSH_USER}@${SSH_HOST}" "mkdir -p '${DEPLOY_PATH}'"

          TARGET_FILE=".env"
          if [ "${TARGET_ENV}" = "prod" ]; then
            TARGET_FILE=".env.production"
          fi

          echo "--> Generating ${TARGET_FILE}..."
          cat <<EOF > generated.env
          # Auto-generated by GitHub Actions CD pipeline
          ADDR=0.0.0.0:8080
          APP_ENV=${APP_ENV}
          DATABASE_URL=${DATABASE_URL}
          PUBLIC_BASE_URL=${PUBLIC_BASE_URL}
          ADMIN_USERNAME=${ADMIN_USERNAME}
          ADMIN_PASSWORD=${ADMIN_PASSWORD}
          MOCK_CORS_ORIGINS=${MOCK_CORS_ORIGINS}
          MOCK_CORS_HEADERS=${MOCK_CORS_HEADERS}
          EOF

          # Remove leading yaml indentation
          sed -i -E 's/^[[:space:]]+//' generated.env

          echo "--> Uploading ${TARGET_FILE} to ${DEPLOY_PATH}..."
          $SCP_CMD generated.env "${SSH_USER}@${SSH_HOST}:${DEPLOY_PATH}/${TARGET_FILE}"
          $SSH_CMD "${SSH_USER}@${SSH_HOST}" "chmod 600 '${DEPLOY_PATH}/${TARGET_FILE}'"

          rm -f generated.env

      - name: Deploy container with Podman via SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
          TARGET_ENV: ${{ needs.build-and-push.outputs.target_env }}
          IMAGE_NAME: ${{ needs.build-and-push.outputs.image_name }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || (needs.build-and-push.outputs.target_env == 'prod' && '/opt/mocklab/prod' || '/opt/mocklab/dev') }}
          APP_PORT: ${{ vars.APP_PORT || '8080' }}
          APP_BIND: ${{ vars.APP_BIND || '127.0.0.1' }}
          PODMAN_EXTRA_ARGS: ${{ vars.PODMAN_EXTRA_ARGS || '' }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          echo "=========================================================="
          echo " Triggering Podman deploy on remote host: ${SSH_USER}@${SSH_HOST}"
          echo " Image : ${IMAGE_NAME}"
          echo " Port  : ${APP_BIND}:${APP_PORT}"
          echo " Auth  : ${SSH_AUTH}"
          echo "=========================================================="

          if [ "${SSH_AUTH}" = "password" ]; then
            SSH_CMD="sshpass -e ssh -o StrictHostKeyChecking=accept-new -p ${SSH_PORT}"
          else
            SSH_CMD="ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=accept-new -p ${SSH_PORT}"
          fi

          # Pipe deploy/podman-deploy.sh directly over SSH stdin
          $SSH_CMD "${SSH_USER}@${SSH_HOST}" \
            "GHCR_TOKEN='${GHCR_TOKEN}' GHCR_USER='${GHCR_USER}' PODMAN_EXTRA_ARGS='${PODMAN_EXTRA_ARGS}' bash -s -- '${TARGET_ENV}' '${IMAGE_NAME}' '${APP_PORT}' '${APP_BIND}' '${DEPLOY_PATH}'" \
            < deploy/podman-deploy.sh
